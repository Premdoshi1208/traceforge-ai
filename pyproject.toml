[project]
name = "traceforge-ai"
version = "1.0.0"
description = "Evidence-driven autonomous incident investigation and repair"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "langgraph>=1.0,<2",
  "python-dotenv>=1.0,<2",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "mypy>=1.15,<2"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["incident_lab/fixtures", ".venv"]
