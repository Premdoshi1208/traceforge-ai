services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://traceforge:localdev@database:5432/traceforge
      APP_ENV: development
      VERIFICATION_MODE: local
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: traceforge
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: traceforge
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceforge"]
      interval: 5s
      retries: 10
volumes:
  postgres-data:
