name: Product checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check backend agent_engine incident_lab verification tests evaluations
      - run: uv run pytest -q
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./ci.db
      - run: uv run python -m evaluations.run
      - run: npm ci && npm run build && npm test -- --run
        working-directory: frontend
