services:
  - type: web
    name: traceforge-ai
    runtime: docker
    plan: free
    region: oregon
    autoDeployTrigger: commit
    healthCheckPath: /readyz
    envVars:
      - key: APP_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: VERIFICATION_MODE
        value: unavailable
      - key: GITHUB_REPOSITORY
        value: Premdoshi1208/traceforge-ai
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: VERIFICATION_UNAVAILABLE_REASON
        value: Live remote verification is disabled; recorded local verification remains available.
      - key: DAILY_RUN_LIMIT
        value: "12"
      - key: SESSION_RUN_LIMIT
        value: "2"
      - key: MAX_CONCURRENT_RUNS
        value: "1"
